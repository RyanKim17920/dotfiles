[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on   = "R"
run  = 'shell --block -- "$HOME/.local/bin/mdview" %s'
desc = "Read markdown rendered, full screen (q to return)"

[[mgr.prepend_keymap]]
on   = [ "g", "r" ]
run  = 'shell -- [ "$(uname)" = Darwin ] && open -R %h'
desc = "Reveal the hovered file in Finder (macOS only)"

# g m: download the selected files (or the hovered one) to this Mac's
# ~/Downloads/<host>/ when Yazi runs on a remote host in a WezTerm ssh pane.
# Sets the WezTerm user var wez_download (OSC 1337, base64) to a nonce line
# and one absolute path per line; the `downloads` feature of ~/.wezterm.lua
# fetches them over the pane's ControlMaster. Inside tmux the sequence is
# wrapped for passthrough, which tmux before 3.3 always allows and 3.3+ only
# with allow-passthrough (turned on here for this pane when it is off).
# --block: a background shell has no /dev/tty, and Yazi pauses its drawing
# so the sequence cannot land inside a frame (the screen flickers once).
# Names containing a newline are skipped. No percent sign in the script
# besides the placeholder: Yazi would expand it.
[[mgr.prepend_keymap]]
on   = [ "g", "m" ]
run  = '''shell --block -- set -- %s
	[ "$#" -gt 0 ] || exit 0
	nl='
'
	list=$$
	for p do
		case $p in *"$nl"*) continue ;; /*) ;; *) p=$PWD/$p ;; esac
		list=$list$nl$p
	done
	v=$(base64 <<B64 | tr -d '\n'
$list
B64
)
	if [ -n "${TMUX:-}" ]; then
		[ "$(tmux display -p -t "$TMUX_PANE" '#{allow-passthrough}' 2>/dev/null)" = off ] \
			&& tmux set -p -t "$TMUX_PANE" allow-passthrough on
		printf "\033Ptmux;\033\033]1337;SetUserVar=wez_download=$v\007\033\\\\"
	else
		printf "\033]1337;SetUserVar=wez_download=$v\007"
	fi > /dev/tty
'''
desc = "Download the selected files to this Mac (WezTerm over ssh)"

# g o: drag the selected files (or the hovered one) out to Finder, the
# Desktop, Mail... On this Mac (not over ssh) it opens ~/.local/bin/wez-drag
# (macos/wez-drag) on them directly. Elsewhere it sets the WezTerm user var
# wez_drag_out exactly as g m sets wez_download; the `drag` feature of
# ~/.wezterm.lua copies them over the pane's ControlMaster into a cache and
# opens wez-drag on the copies.
[[mgr.prepend_keymap]]
on   = [ "g", "o" ]
run  = '''shell --block -- set -- %s
	[ "$#" -gt 0 ] || exit 0
	h=$(command -v wez-drag || echo "$HOME/.local/bin/wez-drag")
	if [ "$(uname)" = Darwin ] && [ -z "${SSH_CONNECTION:-}" ] && [ -x "$h" ]; then
		"$h" out -- "$@" > /dev/null 2>&1 &
		exit 0
	fi
	nl='
'
	list=$$
	for p do
		case $p in *"$nl"*) continue ;; /*) ;; *) p=$PWD/$p ;; esac
		list=$list$nl$p
	done
	v=$(base64 <<B64 | tr -d '\n'
$list
B64
)
	if [ -n "${TMUX:-}" ]; then
		[ "$(tmux display -p -t "$TMUX_PANE" '#{allow-passthrough}' 2>/dev/null)" = off ] \
			&& tmux set -p -t "$TMUX_PANE" allow-passthrough on
		printf "\033Ptmux;\033\033]1337;SetUserVar=wez_drag_out=$v\007\033\\\\"
	else
		printf "\033]1337;SetUserVar=wez_drag_out=$v\007"
	fi > /dev/tty
'''
desc = "Drag the selected files out to Finder (WezTerm)"

# g i: open a drop zone for the current directory: files and folders dropped
# on it from Finder are copied here (uploaded over the ControlMaster when
# Yazi runs on an ssh host). Sets the user var wez_drag_in to a nonce line
# and $PWD, as g m does; the `drag` feature of ~/.wezterm.lua does the rest.
# A name that is taken is never overwritten: the new one becomes `name (1).ext`.
[[mgr.prepend_keymap]]
on   = [ "g", "i" ]
run  = '''shell --block -- nl='
'
	v=$(base64 <<B64 | tr -d '\n'
$$$nl$PWD
B64
)
	if [ -n "${TMUX:-}" ]; then
		[ "$(tmux display -p -t "$TMUX_PANE" '#{allow-passthrough}' 2>/dev/null)" = off ] \
			&& tmux set -p -t "$TMUX_PANE" allow-passthrough on
		printf "\033Ptmux;\033\033]1337;SetUserVar=wez_drag_in=$v\007\033\\\\"
	else
		printf "\033]1337;SetUserVar=wez_drag_in=$v\007"
	fi > /dev/tty
'''
desc = "Drop files from Finder into this folder (WezTerm)"
