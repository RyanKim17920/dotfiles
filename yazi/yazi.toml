[mgr]
ratio = [ 1, 3, 5 ]

[preview]
# Retina: render images/PDF pages at higher resolution (defaults 600x900, q75, triangle)
max_width     = 2000
max_height    = 2600
image_quality = 90
image_filter  = "lanczos3"

[[plugin.prepend_previewers]]
url = "*.md"
# glow-cached caches renders: piper re-runs this on every scroll step
run = 'piper -- "$HOME/.local/bin/glow-cached" "$w" "$1"'

# Enter on Markdown: micro + live glow preview split (WezTerm), see ~/.local/bin/mdedit
[opener]
mdedit = [
	{ run = '"$HOME/.local/bin/mdedit" %s', desc = "micro + live preview", block = true, for = "unix" },
]

[open]
prepend_rules = [
	{ url = "*.md", use = [ "mdedit", "edit", "reveal" ] },
]
