[mgr]
ratio = [ 1, 3, 5 ]

[preview]
# Retina: render images/PDF pages at higher resolution (defaults 600x900, q75, triangle)
max_width     = 2000
max_height    = 2600
image_quality = 90
image_filter  = "lanczos3"

[[plugin.prepend_previewers]]
url = "*.md"
# glow-cached caches renders: piper re-runs this on every scroll step
run = 'piper -- "$HOME/.local/bin/glow-cached" "$w" "$1"'

# Small raster images (icons, small screenshots) are enlarged to ~80% of the
# preview pane instead of drawn at native pixel size; see plugins/upscale.yazi
[[plugin.prepend_previewers]]
mime = "image/{png,jpeg,gif,webp,bmp,x-ms-bmp}"
run  = "upscale"

# Text files: micro, never yazi's built-in ${EDITOR:-vi}. Fallback is $EDITOR
# (unless vi/vim) then nano. A WezTerm peek of path:line:col sets YAZI_PEEK_LINE.
[opener]
edit = [
	{ run = '''
		ed=$(command -v micro)
		if [ -z "$ed" ]; then
			case "${EDITOR##*/}" in ""|vi|vim|nvim|view) ;; *) ed=$(command -v "$EDITOR") ;; esac
		fi
		[ -n "$ed" ] || ed=$(command -v nano)
		set -- %s
		case "$ed" in
			*/micro) [ -n "$YAZI_PEEK_LINE" ] && [ "$1" = "$YAZI_PEEK" ] && set -- "+$YAZI_PEEK_LINE" "$@" ;;
		esac
		exec "$ed" "$@"
	''', desc = "micro", block = true, for = "unix" },
]
# Enter on Markdown: micro + live glow preview split (WezTerm), see ~/.local/bin/mdedit
mdedit = [
	{ run = '"$HOME/.local/bin/mdedit" %s', desc = "micro + live preview", block = true, for = "unix" },
]

[open]
prepend_rules = [
	{ url = "*.md", use = [ "mdedit", "edit", "reveal" ] },
]
